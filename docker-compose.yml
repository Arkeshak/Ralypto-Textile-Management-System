services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ralypto_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      # SQLite zero-config database (matches prisma schema provider = "sqlite")
      DATABASE_URL: "file:/data/dev.db"
      JWT_SECRET: ralypto_super_secure_jwt_secret_lkr_retail_2026
    command: sh -c "npx prisma db push --skip-generate && ([ -f /data/.seeded ] || (npx prisma db seed && touch /data/.seeded)) && node dist/index.js"
    volumes:
      - ralypto_db_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ralypto_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  ralypto_db_data:
